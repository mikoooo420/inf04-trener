<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INF.04 Trener – nauka do egzaminu zawodowego</title>
  <meta name="description" content="Darmowa platforma open-source do nauki INF.04: teoria w pigułce, quizy w formacie CKE, symulacja egzaminu, SQL Lab, Code Lab i arkusze praktyczne.">
  <meta name="theme-color" content="#11131a">
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Motyw ustawiany przed renderem, żeby nie było "mignięcia" jasnego ekranu -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('inf04.progress');
        var pref = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
        var dark = pref === 'dark' || ((!pref || pref === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* zostaje domyślny */ }
    })();
  </script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views/theory.css">
  <link rel="stylesheet" href="./css/views/quiz.css">
  <link rel="stylesheet" href="./css/views/lab.css">
  <link rel="stylesheet" href="./css/views/projects.css">
  <link rel="stylesheet" href="./css/views/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menu-toggle" aria-label="Otwórz menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <a class="brand" href="#/" aria-label="INF.04 Trener – strona główna">
        <img src="./assets/icons/favicon.svg" alt="" width="28" height="28">
        <span class="brand__name">INF.04 <strong>Trener</strong></span>
      </a>

      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search-input" placeholder="Szukaj w teorii… (/)" aria-label="Szukaj w teorii" autocomplete="off">
      </form>

      <div class="topbar__actions">
        <a class="progress-pill" href="#/postepy" id="progress-pill" title="Twój postęp">
          <span class="progress-pill__ring" id="progress-ring"></span>
          <span class="progress-pill__label" id="progress-label">0%</span>
        </a>
        <button class="icon-btn" id="theme-toggle" aria-label="Przełącz motyw">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Główna nawigacja">
      <div class="sidebar__inner" id="sidebar-nav"><!-- generowane w navbar.js --></div>
    </nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="main" id="main" tabindex="-1">
      <div class="view" id="view" aria-live="polite">
        <div class="loading"><span class="spinner"></span> Ładowanie…</div>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Nawigacja mobilna"><!-- generowane w navbar.js --></nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="assertive"></div>

  <noscript>
    <div class="noscript">Ta aplikacja wymaga włączonej obsługi JavaScript.</div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
