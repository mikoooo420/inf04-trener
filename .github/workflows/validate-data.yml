name: Walidacja treści

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sprawdzenie pytań, zadań i arkuszy
        run: node tools/validate-data.mjs
